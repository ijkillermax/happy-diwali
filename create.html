<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create a Diwali wish link</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314061f'/%3E%3Cpath d='M50 12C62 30 68 43 50 58C32 43 38 30 50 12Z' fill='%23ffb627'/%3E%3Cpath d='M14 62Q50 100 86 62Q86 56 50 56Q14 56 14 62Z' fill='%23ee7a2c'/%3E%3C/svg%3E">
<meta name="theme-color" content="#14061f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Hind:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Create a wish link</h1>
  <p class="sub">Type the person’s name. You get a link that opens the Diwali wish with their name, without showing the name in the link.</p>
  <form class="card maker" id="f">
    <label class="who">Who is this wish for?
      <input id="name" type="text" maxlength="24" autocomplete="off" placeholder="Type a name" required>
    </label>
    <button class="btn" type="submit">Create link</button>
  </form>
  <section class="card maker" id="res" hidden>
    <input class="out" id="out" type="text" readonly aria-label="Wish link">
    <div class="row">
      <button class="btn" id="copy" type="button">Copy link</button>
      <a class="btn alt" id="open" href="index.html" target="_blank" rel="noopener">Preview the wish</a>
    </div>
    <p id="note" aria-live="polite"></p>
  </section>
  <a class="back" href="index.html">Back to the wish page</a>
</main>
<script src="create.js" defer></script>
</body>
</html>
